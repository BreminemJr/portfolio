<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 702" fill="none">
  <title>Papirbåt på blått hav</title>
  <desc>En hvit origamibåt flyter på dypt blått vann.</desc>
  <defs>
    <linearGradient id="water" x1="78" y1="0" x2="702" y2="702" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07578B" />
      <stop offset=".53" stop-color="#064E7F" />
      <stop offset="1" stop-color="#03456F" />
    </linearGradient>
    <radialGradient id="water-light" cx="0" cy="0" r="1" gradientTransform="matrix(490 0 0 380 391 343)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1972A1" stop-opacity=".34" />
      <stop offset="1" stop-color="#1972A1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paper" x1="300" y1="254" x2="450" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" />
      <stop offset="1" stop-color="#E9ECEA" />
    </linearGradient>
    <filter id="water-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="17" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .16" />
      </feComponentTransfer>
    </filter>
    <filter id="shadow-blur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <pattern id="speckles" width="31" height="27" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="8" r=".7" fill="#D6EBF5" fill-opacity=".21" />
      <circle cx="17" cy="3" r=".55" fill="#001F3D" fill-opacity=".2" />
      <circle cx="26" cy="19" r=".65" fill="#D6EBF5" fill-opacity=".16" />
      <circle cx="9" cy="23" r=".5" fill="#001F3D" fill-opacity=".18" />
    </pattern>
  </defs>

  <rect width="790" height="702" fill="url(#water)" />
  <rect width="790" height="702" fill="url(#water-light)" />
  <rect width="790" height="702" filter="url(#water-grain)" opacity=".2" />
  <rect width="790" height="702" fill="url(#speckles)" opacity=".72" />

  <g fill="none" stroke-linecap="round">
    <path d="M185 438c50-15 95-18 139-9" stroke="#0A3E65" stroke-opacity=".28" stroke-width="3" />
    <path d="M467 431c47-12 92-10 136 4" stroke="#0A3E65" stroke-opacity=".3" stroke-width="3" />
    <path d="M252 453c81 13 205 16 286-1" stroke="#1A6895" stroke-opacity=".45" stroke-width="2" />
    <path d="M309 464c56 6 116 6 169-1" stroke="#1C6B98" stroke-opacity=".28" stroke-width="2" />
  </g>

  <ellipse cx="410" cy="436" rx="181" ry="19" fill="#002F53" fill-opacity=".42" filter="url(#shadow-blur)" />
  <path d="M194 264 361 309l50-58 57 58 158-71-53 133c-8 20-23 32-47 38-70 18-148 19-222 1-22-5-39-18-48-39l-62-107Z" fill="url(#paper)" />

  <path d="m194 264 167 45 50 58-125-23c-21-4-38-13-48-29l-44-51Z" fill="#F4F5F2" />
  <path d="m194 264 167 45 50 58-135-41c-17-5-31-13-40-26l-42-36Z" fill="#E3E8E8" />
  <path d="m361 309 50-58v116l-50-58Z" fill="#FFF" />
  <path d="m411 251 57 58-57 116V251Z" fill="#E8ECEB" />
  <path d="M411 251 626 238 561 347Q544 369 514 376l-103 10 57-77-57-58Z" fill="#FAFAF7" />
  <path d="m468 309 93 38Q544 369 514 376l-103 10 57-77Z" fill="#E4E8E7" />

  <path d="m194 264 167 45 50-58 57 58 158-71-53 133c-8 20-23 32-47 38-70 18-148 19-222 1-22-5-39-18-48-39l-62-107Z" stroke="#FFF" stroke-opacity=".76" stroke-width="2" stroke-linejoin="round" />
  <path d="m361 309 50 58 57-58M411 251v158M258 352c84 32 222 34 306 0" stroke="#BFC8C9" stroke-opacity=".72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
